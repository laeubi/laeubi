name: Project suggestion
description: Suggest an open source project I should look at.
labels: ["project-suggestion"]
body:
  - type: input
    id: project
    attributes:
      label: Project
      placeholder: https://github.com/...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it important to you?
      description: How do you use it, and what is missing or at risk?
    validations:
      required: true
